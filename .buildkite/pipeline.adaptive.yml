# C. Adaptive parallelism: instead of waiting, pick how many test shards to run
# from free vCPU across the whole org right now, then upload a parallel test step.
# Requires Buildkite secret GRAPHQL_API_TOKEN (API token with GraphQL access, read_clusters, read_builds).

env:
  BK_ORG_SLUG: "buildkite-solutions"
  BK_CLUSTER_ID: "Q2x1c3Rlci0tLTUzNmM1OWEyLTRjMzctNGYwMi04Y2VmLWUwNDZjNDcwNGZiZQ=="  # cluster this pipeline runs in
  TARGET_QUEUE_KEY: "${TARGET_QUEUE_KEY:-hosted_backpressure}"   # 2 vCPU hosted Linux queue
  MAX_VCPU: "${MAX_VCPU:-20}"          # org-wide vCPU budget
  PEAK_UTIL: "${PEAK_UTIL:-0.7}"       # at or above this utilization, builds get MIN_SHARDS
  MIN_SHARDS: "${MIN_SHARDS:-1}"
  MAX_SHARDS: "${MAX_SHARDS:-5}"       # 20 vCPU / 2 vCPU = 10 shards fit; FIT/2 = 5 on an idle org
  VCPU_OVERRIDES: "${VCPU_OVERRIDES:-}"   # self-hosted queues to count, e.g. "linux-large:16 kube_local:4"
  POLL_SECONDS: "${POLL_SECONDS:-15}"

steps:
  - label: ":abacus: Pick shard count from free capacity"
    key: plan
    # One planner at a time, org-wide, so two builds never read the same headroom.
    concurrency_group: "backpressure-adaptive"
    concurrency: 1
    secrets:
      - GRAPHQL_API_TOKEN
    command: .buildkite/scripts/adaptive.sh
