# Back-pressure demo: hold the build until kube_local has fewer than MAX_RUNNING running jobs.
# Cluster: Golden Gate Cluster. The gate runs on the cluster default queue (hosted_linux_small).
# Requires Buildkite secret GRAPHQL_API_TOKEN (API token with GraphQL access).

env:
  BK_ORG_SLUG: "buildkite-solutions"
  BK_CLUSTER_ID: "Q2x1c3Rlci0tLTUzNmM1OWEyLTRjMzctNGYwMi04Y2VmLWUwNDZjNDcwNGZiZQ=="  # Golden Gate Cluster
  BK_QUEUE_ID: "Q2x1c3RlclF1ZXVlLS0tN2JiN2NiMWMtMjcwYi00NTQ4LThiZjMtMDA2ZGU0NDBkYTFm"  # kube_local
  MAX_RUNNING: "10"
  POLL_SECONDS: "15"

steps:
  - label: ":traffic_light: Gate: wait for kube_local capacity"
    key: gate
    secrets:
      - GRAPHQL_API_TOKEN
    command: .buildkite/scripts/gate.sh

  - label: ":kubernetes: Work job 1"
    depends_on: gate
    agents:
      queue: kube_local
    command: sleep 60

  - label: ":kubernetes: Work job 2"
    depends_on: gate
    agents:
      queue: kube_local
    command: sleep 60
