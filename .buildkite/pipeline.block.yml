# Block-gated variant: each build starts parked on a block step.
# The capacity controller pipeline (pipeline.controller.yml) unblocks builds
# oldest-first while hosted_backpressure has room under its cap.

steps:
  - block: ":vertical_traffic_light: Waiting for hosted_backpressure capacity"
    key: capacity-gate
    prompt: "Unblocked automatically by the hosted_backpressure capacity controller. Unblock by hand to skip the queue."

  - label: ":cloud: Work job 1"
    depends_on: capacity-gate
    agents:
      queue: hosted_backpressure
    command: sleep 60

  - label: ":cloud: Work job 2"
    depends_on: capacity-gate
    agents:
      queue: hosted_backpressure
    command: sleep 60
