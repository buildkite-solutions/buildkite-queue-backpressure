# Block-gated variant: each build starts parked on a block step.
# The capacity controller pipeline (pipeline.controller.yml) unblocks builds
# oldest-first while kube_local has room under its cap.

steps:
  - block: ":vertical_traffic_light: Waiting for kube_local capacity"
    key: capacity-gate
    prompt: "Unblocked automatically by the kube_local capacity controller. Unblock by hand to skip the queue."

  - label: ":kubernetes: Work job 1"
    depends_on: capacity-gate
    agents:
      queue: kube_local
    command: sleep 60

  - label: ":kubernetes: Work job 2"
    depends_on: capacity-gate
    agents:
      queue: kube_local
    command: sleep 60
