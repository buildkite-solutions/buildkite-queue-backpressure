# Capacity controller: watches hosted_backpressure and unblocks block-gated builds
# (oldest first) while in-flight + JOBS_PER_BUILD <= MAX_RUNNING.
# Requires Buildkite secret GRAPHQL_API_TOKEN with GraphQL access, read_builds and write_builds.

env:
  BK_ORG_SLUG: "buildkite-solutions"
  BK_CLUSTER_ID: "Q2x1c3Rlci0tLTUzNmM1OWEyLTRjMzctNGYwMi04Y2VmLWUwNDZjNDcwNGZiZQ=="  # Golden Gate Cluster
  BK_QUEUE_ID: "${BK_QUEUE_ID:-Q2x1c3RlclF1ZXVlLS0tZjAyNjlhMmMtM2ZhYi00YzQ0LWFiMzItNzBkYmI1ZDcyNTQ5}"  # hosted_backpressure
  TARGET_PIPELINES: "backpressure-b-block-step"   # space-separated pipeline slugs to manage
  MAX_RUNNING: "${MAX_RUNNING:-10}"
  JOBS_PER_BUILD: "2"
  POLL_SECONDS: "${POLL_SECONDS:-10}"
  RUN_MINUTES: "${RUN_MINUTES:-30}"

steps:
  - label: ":control_knobs: hosted_backpressure capacity controller"
    # Only one controller may run, or two could hand out the same capacity.
    concurrency_group: "back-pressure-capacity-controller"
    concurrency: 1
    secrets:
      - GRAPHQL_API_TOKEN
    command: .buildkite/scripts/controller.sh
